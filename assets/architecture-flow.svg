<svg xmlns="http://www.w3.org/2000/svg" width="720" height="962" viewBox="0 0 720 962" role="img" aria-labelledby="title desc">
  <title id="title">Skill Forge architecture flow</title>
  <desc id="desc">A six-step vertical workflow designed to remain readable on phones and desktop screens.</desc>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker></defs>
  <style>.bg{fill:#f8fafc}.title{font:700 30px system-ui,sans-serif;fill:#0f172a}.subtitle{font:400 18px system-ui,sans-serif;fill:#475569}.node{fill:#e0f2fe;stroke:#0369a1;stroke-width:3}.label{font:600 23px system-ui,sans-serif;fill:#0f172a}.arrow{stroke:#0369a1;stroke-width:4;fill:none;marker-end:url(#arrowhead)}</style>
  <rect class="bg" width="100%" height="100%" rx="24"/>
  <text x="360" y="50" text-anchor="middle" class="title">Skill Forge</text>
  <text x="360" y="82" text-anchor="middle" class="subtitle">Architecture flow</text>
  <path d="M 360 200 V 234" class="arrow"/><rect x="80" y="118" width="560" height="82" rx="18" class="node"/><text x="360" y="169" text-anchor="middle" class="label">1. Define focused capability</text>
<path d="M 360 338 V 372" class="arrow"/><rect x="80" y="256" width="560" height="82" rx="18" class="node"/><text x="360" y="307" text-anchor="middle" class="label">2. Create skill scaffold</text>
<path d="M 360 476 V 510" class="arrow"/><rect x="80" y="394" width="560" height="82" rx="18" class="node"/><text x="360" y="445" text-anchor="middle" class="label">3. Validate metadata</text>
<path d="M 360 614 V 648" class="arrow"/><rect x="80" y="532" width="560" height="82" rx="18" class="node"/><text x="360" y="583" text-anchor="middle" class="label">4. Write minimal workflow</text>
<path d="M 360 752 V 786" class="arrow"/><rect x="80" y="670" width="560" height="82" rx="18" class="node"/><text x="360" y="721" text-anchor="middle" class="label">5. Run deterministic checks</text>
<rect x="80" y="808" width="560" height="82" rx="18" class="node"/><text x="360" y="859" text-anchor="middle" class="label">6. Package for sharing</text>
</svg>
